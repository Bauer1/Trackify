{% extends "base.html" %}
{% block title %}{{ mode }} expense{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>{{ mode }} expense</h2>
  <form method="post" class="form">
    <label>Amount
      <input type="number" name="amount" step="0.01" min="0.01" required
             value="{{ expense.amount }}" autofocus>
    </label>
    <label>Category
      <select name="category" required>
        {% for c in categories %}
          <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Date
      <input type="date" name="spent_on" required value="{{ expense.spent_on }}">
    </label>
    <label>Description
      <input type="text" name="description" maxlength="200" value="{{ expense.description }}"
             placeholder="e.g. Groceries at market">
    </label>
    <div class="form-actions">
      <a href="{{ url_for('index') }}" class="btn">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</section>
{% endblock %}
